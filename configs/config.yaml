# Global experiment configuration for the ZT-FedTrust federated learning simulator.

seed: 42
device: "cuda"  # "cuda" or "cpu"; automatically falls back to cpu if cuda is unavailable

data:
  dataset: "mnist"          # "mnist" | "cifar10"
  data_dir: "./data_cache"  # where raw datasets are downloaded/cached
  num_clients: 4
  batch_size: 32
  partition:
    type: "iid"              # "iid" | "dirichlet"
    alpha: 0.5                # Dirichlet concentration parameter (lower = more non-IID)

model:
  name: "cnn"                 # registered model name, see models/cnn.py

federated:
  num_rounds: 3
  clients_per_round: 2
  local_epochs: 1
  learning_rate: 0.01
  momentum: 0.9

logging:
  log_dir: "./results/logs"
  log_level: "INFO"
  results_dir: "./results"

# Zero Trust evaluation + trust-based selection/aggregation (Phase 2 + Phase 3).
trust:
  enabled: true
  initial_reputation: 0.80
  reputation_alpha: 0.80
  threshold_mode: fixed      # "fixed" | "adaptive" (mean - 0.5*stdev of current trust scores)
  threshold: 0.60            # used directly in "fixed" mode; fallback in "adaptive" mode
  participation_fraction: 0.50  # fraction of trust-eligible clients selected each round
  weights:
    identity: 0.25
    integrity: 0.20
    behaviour: 0.20
    reputation: 0.15
    update_quality: 0.20

# Aggregation strategy: "fedavg" (plain sample-weighted, Phase 1) or
# "trust_fedavg" (sample-and-trust-weighted, Phase 3). Switch via config only.
aggregation:
  strategy: trust_fedavg

# Adversarial attack simulation (Phase 4). All disabled by default so plain
# Phase 1-3 runs are unaffected. `client.is_malicious` is a ground-truth
# label used only by evaluation/ — the server and trust/ code never read it.
attacks:
  enabled: false
  malicious_client_fraction: 0.20
  active_attack: label_flipping  # "label_flipping" | "model_poisoning" | "byzantine" | "sybil"
  label_flipping:
    enabled: false
    probability: 1.0
  model_poisoning:
    enabled: false
    probability: 1.0
    scale_factor: 5.0
  byzantine:
    enabled: false
    probability: 1.0
    strategy: random  # "random" | "negate"
  sybil:
    enabled: false
    number_of_identities: 3
    probability: 1.0
