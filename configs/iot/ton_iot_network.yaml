# TON_IoT network-flow multi-class `type` classification. Supports
# active_attack: real_traffic (real normal/attack split).
#
# Usage:
#   python simulation/run.py --config configs/iot/ton_iot_network.yaml --experiment compare_all

seed: 42
device: "cpu"

data:
  dataset: "ton_iot_network"
  data_dir: "./ZT-Fedtrust Datasets"
  num_clients: 10
  batch_size: 32
  max_rows: 5000
  partition:
    type: "dirichlet"
    alpha: 0.5

model:
  name: "mlp"

federated:
  num_rounds: 5
  clients_per_round: 6
  local_epochs: 1
  learning_rate: 0.01
  momentum: 0.9

logging:
  log_dir: "./results/iot_ton_iot_network/logs"
  log_level: "INFO"
  results_dir: "./results/iot_ton_iot_network"

trust:
  enabled: true
  initial_reputation: 0.80
  reputation_alpha: 0.80
  threshold_mode: adaptive
  threshold: 0.60
  participation_fraction: 0.70
  weights:
    identity: 0.25
    integrity: 0.20
    behaviour: 0.20
    reputation: 0.15
    update_quality: 0.20

aggregation:
  strategy: trust_fedavg

attacks:
  enabled: true
  malicious_client_fraction: 0.20
  active_attack: real_traffic
  label_flipping:
    enabled: false
    probability: 1.0
  model_poisoning:
    enabled: false
    probability: 1.0
    scale_factor: 5.0
  byzantine:
    enabled: false
    probability: 1.0
    strategy: negate
  sybil:
    enabled: false
    number_of_identities: 3
    probability: 1.0
